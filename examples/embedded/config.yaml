# Minimal/embedded-friendly AgentGateway configuration.
#
# This keeps runtime overhead low while retaining structured request/audit logs:
#   - one worker thread
#   - admin/stats/readiness servers disabled
#   - SQLite/PostgreSQL request-log persistence disabled
#   - OTLP export disabled
#   - access log remains enabled via the normal tracing/logging path
config:
  workerThreads: 1
  adminAddr: off
  statsAddr: off
  readinessAddr: off
  logging:
    level: info
    format: json

frontendPolicies:
  accessLog:
    add:
      user: 'coalesce(jwt.sub, apiKey.user, basicAuth.username, source.address, "unknown")'
      model: 'llm.request.model'
      inputTokens: 'llm.request.inputTokens'
      outputTokens: 'llm.response.outputTokens'
      cost: 'llm.response.cost'
      traceId: 'trace.traceId'

binds:
- port: 8080
  listeners:
  - name: default
    protocol: HTTP
    routes:
    - name: default
      matches:
      - path:
          pathPrefix: /
      backends:
      - host: 127.0.0.1:8081
